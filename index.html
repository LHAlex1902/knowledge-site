<title>知识脉络 · 学习地图</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --card:#1c2128; --border:#30363d;
    --text:#e6edf3; --text2:#8b949e; --accent:#58a6ff; --accent2:#1f6feb;
    --green:#3fb950; --orange:#d29922; --purple:#bc8cff; --teal:#39c5cf;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ===== 诗词背景层（底层、不可点击、仅显示） ===== */
  .poem-bg{
    position:fixed;inset:0;z-index:0;overflow:hidden;
    pointer-events:none; /* 不拦截任何点击/拖拽 */
  }
  /* 每个“单元”＝两句诗，绝对定位散乱排布于整页 */
  .poem-unit{
    position:absolute;
    display:flex;flex-direction:row;direction:rtl; /* 右起第一句，向左排列 */
    align-items:flex-start;
    user-select:none;
  }
  .poem-line{
    writing-mode:vertical-rl;          /* 从上往下竖排 */
    text-orientation:upright;
    font-family:"Mao Zedong","毛泽东字体","STXingkai","STKaiti","KaiTi","楷体",serif;
    font-size:clamp(20px,2.6vw,30px);
    line-height:1.85;letter-spacing:3px;
    color:rgba(212,175,55,.55);        /* 严肃烫金，清晰可见但不刺眼 */
    white-space:nowrap;
    padding:0 5px;
  }
  /* 让所有内容浮在诗词背景之上（topnav 自带 z-index:100 吸顶，无需处理） */
  .hero,.notes-sec,.hint,.wrap,footer,.gate{position:relative;z-index:1}

  /* hero 诗句引用 */
  .hero-quote{
    color:#e60000 !important;font-weight:800;
    font-family:"Mao Zedong","毛泽东字体","STXingkai","STKaiti","KaiTi","楷体",serif;
    font-size:clamp(22px,3.6vw,30px);
    letter-spacing:3px;margin:0 auto 22px;line-height:1.6;
    text-shadow:0 2px 14px rgba(230,0,0,.35);
  }

  /* topnav */
  .topnav{
    position:sticky;top:0;z-index:100;
    background:rgba(13,17,23,.72); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .topnav-inner{
    max-width:1180px;margin:0 auto;padding:12px 24px;
    display:flex;align-items:center;gap:20px;
  }
  .logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .nav-links{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .nav-links a{
    padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text2);transition:.2s;
  }
  .nav-links a:hover{color:var(--text);background:var(--card)}
  .nav-links a.active{color:var(--accent);background:var(--card)}

  /* hero */
  .hero{
    max-width:1180px;margin:0 auto;padding:56px 24px 30px;text-align:center;
  }
  .hero .emoji{font-size:52px;margin-bottom:14px}
  .hero h1{font-size:36px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px}
  .hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--text2);font-size:15.5px;max-width:620px;margin:0 auto 22px}
  .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:20px;font-size:13px;
    background:var(--card);border:1px solid var(--border);color:var(--text2);
  }
  .badge b{color:var(--accent)}

  /* toolbar */
  .toolbar{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;
    border:1px solid var(--border);background:var(--card);color:var(--text);transition:.2s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn.primary:hover{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.mini{padding:5px 12px;font-size:13px;border-radius:9px}
  .scan-status{font-size:12px;color:var(--text2);margin-top:10px;min-height:16px}

  /* hint */
  .hint{
    max-width:1180px;margin:0 auto;padding:0 24px;
    font-size:12.5px;color:var(--text2);text-align:center;margin-bottom:8px;
  }
  .hint b{color:var(--accent)}

  /* ===== 便签区 ===== */
  .notes-sec{max-width:1180px;margin:0 auto;padding:8px 24px 4px}
  .notes-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .notes-head h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
  .notes-head .add-note{margin-left:auto}
  .notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .note{
    position:relative;border-radius:var(--radius);padding:14px 34px 14px 16px;
    min-height:96px;color:#23262f;font-weight:500;font-size:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.28);transition:.2s;cursor:text;
    display:flex;align-items:flex-start;
  }
  .note:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.38)}
  .note .note-body{
    flex:1;outline:none;min-height:52px;word-break:break-word;line-height:1.5;font-weight:500;
  }
  .note .note-body:empty:before{content:attr(data-ph);opacity:.45}
  .note .note-del{
    position:absolute;top:8px;right:9px;width:20px;height:20px;line-height:18px;
    border:none;border-radius:50%;background:rgba(0,0,0,.12);color:#23262f;
    font-size:15px;cursor:pointer;text-align:center;padding:0;transition:.2s;
  }
  .note .note-del:hover{background:rgba(0,0,0,.3)}

  /* sections */
  .wrap{max-width:1180px;margin:0 auto;padding:16px 24px 80px}
  .category{margin-top:32px}
  .cat-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .cat-head .icon{font-size:22px}
  .cat-head h2{font-size:19px;font-weight:700}
  .cat-head .count{margin-left:auto;font-size:13px;color:var(--text2);background:var(--card);padding:3px 10px;border-radius:12px;border:1px solid var(--border)}

  /* cards grid —— App 图标式小方块 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;min-height:60px;
    border-radius:var(--radius);transition:.2s;padding:4px;border:1px dashed transparent}
  .grid.drop-active{border-color:var(--accent);background:rgba(88,166,255,.06)}
  .grid.drop-active .drop-placeholder{display:block}
  .drop-placeholder{display:none;grid-column:1/-1;text-align:center;padding:22px;color:var(--accent);font-size:13px}

  .card{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 8px 12px;transition:.22s;position:relative;cursor:grab;
    min-height:104px;justify-content:flex-start;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);opacity:0;transition:.22s}
  .card:hover::before{opacity:1}
  .card.dragging{opacity:.4;cursor:grabbing}
  .card .grip{position:absolute;right:8px;top:7px;color:var(--text2);font-size:12px;opacity:.35}
  .card .c-emoji{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin-bottom:8px}
  .card .fi-bg{font-size:30px;line-height:1}
  .card .fi-img{position:absolute;width:34px;height:34px;object-fit:contain;border-radius:4px}
  .card .c-name{
    font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:34px;color:var(--text);
  }
  .card .c-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:16px}
  .tag{padding:1px 7px;border-radius:9px;font-size:10.5px;border:1px solid var(--border);color:var(--text2)}
  .tag.doc{color:var(--teal);border-color:rgba(57,197,207,.4)}
  .tag.inter{color:var(--purple);border-color:rgba(188,140,255,.4)}
  .tag.link{color:var(--accent);border-color:rgba(88,166,255,.4)}
  /* 网址卡片右上角编辑钮 */
  .card .card-edit{
    position:absolute;left:8px;top:7px;width:18px;height:18px;line-height:16px;
    border:none;border-radius:50%;background:rgba(255,255,255,.06);color:var(--text2);
    font-size:12px;cursor:pointer;text-align:center;padding:0;opacity:0;transition:.2s;
  }
  .card.is-link:hover .card-edit{opacity:1}
  .card .card-edit:hover{color:var(--accent);background:rgba(88,166,255,.15)}

  /* inbox（待分类）区 */
  #inbox .cat-head .icon{color:var(--orange)}

  /* empty placeholder */
  .empty{
    grid-column:1/-1;text-align:center;padding:24px;border:1px dashed var(--border);
    border-radius:var(--radius);color:var(--text2);font-size:13px;background:rgba(255,255,255,.02);
  }
  .empty .plus{font-size:22px;display:block;margin-bottom:6px;opacity:.5}

  /* ===== 添加/编辑网址弹窗 ===== */
  .modal-mask{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-mask.show{display:flex}
  .modal{
    width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);
    border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3{font-size:17px;margin-bottom:14px}
  .modal label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px}
  .modal input[type=text]{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:14px;outline:none;margin-bottom:12px;
  }
  .modal input[type=text]:focus{border-color:var(--accent)}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  .modal-status{font-size:12px;color:var(--text2);margin-top:10px;min-height:16px}

  /* ===== 密码门禁 ===== */
  .gate{
    position:fixed;inset:0;z-index:300;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gate.hide{display:none}
  .gate-box{text-align:center;max-width:340px;width:100%}
  .gate-box .g-emoji{font-size:46px;margin-bottom:14px}
  .gate-box h2{font-size:20px;font-weight:800;margin-bottom:6px}
  .gate-box .g-sub{color:var(--text2);font-size:13px;margin-bottom:22px}
  .gate-dots{display:flex;gap:14px;justify-content:center;margin-bottom:18px}
  .gate-dots i{
    width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border);
    background:transparent;display:block;transition:.15s;
  }
  .gate-dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.05)}
  .gate-input{
    width:100%;text-align:center;letter-spacing:14px;
    font-size:30px;font-weight:700;padding:12px 8px;border-radius:12px;
    border:1px solid var(--border);background:var(--bg2);color:var(--text);
    outline:none;caret-color:var(--accent);
  }
  .gate-input:focus{border-color:var(--accent)}
  .gate-input.err{border-color:#f85149;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .gate-tip{color:var(--text2);font-size:12px;margin-top:14px;min-height:16px}
  .gate-tip.err{color:#f85149}

  footer{max-width:1180px;margin:0 auto;padding:30px 24px 60px;text-align:center;color:var(--text2);font-size:12px;border-top:1px solid var(--border)}

  @media(max-width:600px){
    .hero h1{font-size:27px}
    .hero p{font-size:14px}
    .nav-links{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
    .card{min-height:96px;padding:12px 6px 10px}
    .card .c-emoji{width:36px;height:36px}
    .card .fi-bg{font-size:26px}
    .card .fi-img{width:30px;height:30px}
    .notes-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .note{min-height:88px;font-size:13px}
    .gate-input{font-size:26px;letter-spacing:11px}
    .gate-dots{gap:12px}
  }
</style>
</head>

// ===== 工具 =====
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function hostOf(url){
  try{ return new URL(url).hostname; }catch(e){ return url; }
}

  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_LAYOUT)); }catch(e){}
  if(saved && typeof saved === 'object'){
    var base = {basic:[],dev:[],test:[],memo:[],inbox:[]};
    SEC_IDS.forEach(function(id){ base[id] = Array.isArray(saved[id]) ? saved[id] : []; });
    base.inbox = Array.isArray(saved.inbox) ? saved.inbox : [];
    return base;
  }
  var layout = {basic:[],dev:[],test:[],memo:[],inbox:[]};
  Object.keys(META).forEach(function(file){
    var sec = NAME2SEC[file] || 'inbox';
    layout[sec].push(file);
  });
  return layout;
}
function saveLayout(){ try{ localStorage.setItem(LS_LAYOUT, JSON.stringify(LAYOUT)); }catch(e){} }

function cardHtml(token){
  var m = META[token] || {};
  var title = m.title || token.replace(/\.html?$/i,'');

  var tags = (m.tags || []).map(function(t){

function itemHtml(token){

// ===== 拖拽逻辑 =====
var DRAG_ITEM = null;
function bindDnD(){
  var cards = document.querySelectorAll('.card');
  var grids = document.querySelectorAll('.grid');

  cards.forEach(function(c){
    c.addEventListener('dragstart', function(e){
      DRAG_ITEM = c.getAttribute('data-item');
      c.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', DRAG_ITEM); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
    });
    c.addEventListener('dragend', function(){
      c.classList.remove('dragging');
      DRAG_ITEM = null;
    });
  });

  grids.forEach(function(g){
    g.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      g.classList.add('drop-active');
    });
    g.addEventListener('dragleave', function(e){
      if(e.target === g) g.classList.remove('drop-active');
    });
    g.addEventListener('drop', function(e){
      e.preventDefault();
      g.classList.remove('drop-active');
      var item = DRAG_ITEM;
      try{ item = e.dataTransfer.getData('text/plain') || item; }catch(err){}
      if(!item) return;
      moveTo(e.currentTarget.getAttribute('data-sec'), item);
    });
  });
}

function moveTo(toSec, item){
  SEC_IDS.forEach(function(id){
    var i = LAYOUT[id].indexOf(item);
    if(i !== -1){ LAYOUT[id].splice(i,1); }
  });
  var ii = LAYOUT.inbox.indexOf(item);
  if(ii !== -1){ LAYOUT.inbox.splice(ii,1); }

  if(SEC_IDS.indexOf(toSec) !== -1){
    if(LAYOUT[toSec].indexOf(item) === -1) LAYOUT[toSec].push(item);
  } else if(toSec === 'inbox'){
    if(LAYOUT.inbox.indexOf(item) === -1) LAYOUT.inbox.push(item);
  }
  saveLayout();
  render();
}

function scanRepo(){
  var btn = document.getElementById('scanBtn');
  var status = document.getElementById('scanStatus');
  btn.disabled = true;
  status.textContent = '🔍 正在扫描仓库 ' + GH_USER + '/' + GH_REPO + ' ...';

  var apiUrl = 'https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/?ref=main';
  fetch(apiUrl, {headers:{'Accept':'application/vnd.github+json'}})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(files){
      var added = 0;
      files.forEach(function(f){
        if(f.type === 'file' && /\.html?$/i.test(f.name)){
          var name = decodeURIComponent(f.name);
          if(!META[name]){
            META[name] = {
              emoji:'📄',
              title:name.replace(/\.html?$/i,''),
              desc:'仓库中的教程文件，点击打开。',
              tags:[{cls:'',text:'仓库文件'}]
            };
          }
          var placed = false;
          SEC_IDS.forEach(function(id){ if(LAYOUT[id].indexOf(name)!==-1) placed=true; });
          if(!placed && LAYOUT.inbox.indexOf(name) === -1){
            LAYOUT.inbox.push(name);
            added++;
          }
        }
      });
      saveLayout();
      render();
      if(added === 0){
        status.textContent = '✅ 扫描完成：没有发现新文件（仓库里的 HTML 都已归类或在待分类区）。';
      } else {
        status.textContent = '✅ 发现 ' + added + ' 个新文件，已放入「📥 待分类」区。拖动卡片到上方板块即可归类。';
      }
    })
    .catch(function(err){
      status.textContent = '⚠️ 检索失败：' + err.message + '（可能是网络或 API 速率限制，稍后再试）。';
    })
    .then(function(){ btn.disabled = false; });
}

function normalizeUrl(v){
  v = (v||'').trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
  return v;
}
function submitLink(){

// 通过 CORS 代理抓取网页 title / description / favicon
function fetchLinkMeta(url, id){
  var proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  fetch(proxy)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(html){
      var info = parseHtmlMeta(html, url);
      var lk = LINKS.filter(function(x){return x.id===id;})[0];
      if(lk){
        if(info.title) lk.title = info.title;
        if(info.desc) lk.desc = info.desc;
        if(info.icon) lk.icon = info.icon;
        if(!lk.title || lk.title==='读取中…') lk.title = hostOf(url);
      }
      saveLinks(); render();
    })
    .catch(function(){
      // 抓取失败：用域名兜底
      var lk = LINKS.filter(function(x){return x.id===id;})[0];
      if(lk && (!lk.title || lk.title==='读取中…')) lk.title = hostOf(url);
      saveLinks(); render();
    });
}
function parseHtmlMeta(html, url){
  var out = {title:'', desc:'', icon:''};
  // title
  var ogTitle = html.match(/property=["']og:title["'][^>]*content=["']([^"']*)["']/i);
  var ttl = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  var title = (ogTitle && ogTitle[1]) || (ttl && ttl[1]) || '';
  out.title = title.replace(/\s+/g,' ').trim();
  // description
  var ogDesc = html.match(/property=["']og:description["'][^>]*content=["']([^"']*)["']/i);
  var metaDesc = html.match(/name=["']description["'][^>]*content=["']([^"']*)["']/i);
  var desc = (ogDesc && ogDesc[1]) || (metaDesc && metaDesc[1]) || '';
  out.desc = desc.replace(/\s+/g,' ').trim();
  // favicon
  var ico = html.match(/<link[^>]+rel=["'](?:shortcut )?icon["'][^>]*href=["']([^"']*)["']/i)
         || html.match(/<link[^>]+href=["']([^"']*)["'][^>]+rel=["'](?:shortcut )?icon["']/i)
         || html.match(/<link[^>]+rel=["']apple-touch-icon["'][^>]*href=["']([^"']*)["']/i);
  if(ico && ico[1]){
    try{ out.icon = new URL(ico[1], url).href; }catch(e){ out.icon = ico[1]; }
  }
  return out;
}

var POEMS = [
  ['已是悬崖百丈冰', '犹有花枝俏'],
  ['钟山风雨起苍黄', '百万雄师过大江'],
  ['雄关漫道真如铁', '而今迈步从头越'],
  ['金沙水拍云崖暖', '大渡桥横铁索寒'],
  ['天若有情天亦老', '人间正道是沧桑'],
  ['萧瑟秋风今又是', '换了人间'],
  ['已是悬崖百丈冰', '犹有花枝俏'],
  ['为有牺牲多壮志', '敢教日月换新天']
];
function renderPoems(){
  var box = document.getElementById('poemBg');
  if(!box) return;
  // 阵列式均匀排布：网格布局，单元落在每个格子中心，仅加极轻微抖动
  // 窄屏(手机)用 2列×4行，宽屏用 4列×2行，保证均匀不重叠
  var narrow = window.innerWidth < 640;
  var cols = narrow ? 2 : 4;
  var rows = narrow ? 4 : 2;
  var html = '';
  for(var k=0;k<POEMS.length;k++){
    var pair = POEMS[k];
    var c = k % cols;              // 列
    var r = Math.floor(k/cols);    // 行
    // 格子中心坐标（均匀分布）
    var left = ((c + 0.5) / cols * 100).toFixed(2);
    var top  = ((r + 0.5) / rows * 100).toFixed(2);
    var jitterX = (Math.random()*4 - 2).toFixed(2);   // ±2% 轻微错位
    var jitterY = (Math.random()*4 - 2).toFixed(2);
    var rot = (Math.random()*4 - 2).toFixed(2);       // 轻微旋转
    var opacity = (0.5 + Math.random()*0.25).toFixed(3); // 0.5~0.75
    html += '<div class="poem-unit" style="left:'+left+'%;top:'+top+'%;'+
            'transform:translate(calc(-50% + '+jitterX+'%), calc(-50% + '+jitterY+'%)) rotate('+rot+'deg);opacity:'+opacity+'">'+
              '<span class="poem-line">'+esc(pair[0])+'</span>'+
              '<span class="poem-line">'+esc(pair[1])+'</span>'+
            '</div>';
  }
  box.innerHTML = html;
}

function gateInit(){
  var cfg = window.SITE_CONFIG || {password:"2026", rememberDays:7};
  var days = (typeof cfg.rememberDays === 'number') ? cfg.rememberDays : 7;

  // 若开启了记住设备，且本地有未过期的通过记录 → 直接放行
  if(days > 0){
    try{
      var ts = parseInt(localStorage.getItem(LS_GATE) || '0', 10);
      if(ts && (Date.now() - ts) < days * 24 * 3600 * 1000){
        gateOpen();
        return;
      }
    }catch(e){}
  }
  // 否则显示门禁
  gateBind(cfg);
}

function gateBind(cfg){
  var gate = document.getElementById('gate');
  var input = document.getElementById('gateInput');
  var dots = document.getElementById('gateDots').children;
  var tip = document.getElementById('gateTip');

  input.addEventListener('input', function(){
    var v = input.value.replace(/\D/g,'').slice(0,4);
    input.value = v;
    for(var i=0;i<dots.length;i++){ dots[i].classList.toggle('on', i < v.length); }
    if(v.length === 4){
      if(v === cfg.password){
        gatePass(cfg);
      } else {
        input.classList.add('err');
        tip.textContent = '密码错误，请重试';
        tip.classList.add('err');
        setTimeout(function(){
          input.value=''; input.classList.remove('err');
          tip.textContent=''; tip.classList.remove('err');
          for(var j=0;j<dots.length;j++){ dots[j].classList.remove('on'); }
          input.focus();
        }, 700);
      }
    }
  });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ input.blur(); }
  });
  setTimeout(function(){ input.focus(); }, 60);
}

function gatePass(cfg){
  var days = (typeof cfg.rememberDays === 'number') ? cfg.rememberDays : 7;
  if(days > 0){
    try{ localStorage.setItem(LS_GATE, String(Date.now())); }catch(e){}
  }
  gateOpen();
}

function gateOpen(){
  var gate = document.getElementById('gate');
  if(gate){ gate.classList.add('hide'); }
  boot();
}

renderPoems();
gateInit();
</script>
