<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="ASQAJgqzNV7u3PBO79uEFJ">

<title>知识脉络 · 学习地图</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --card:#1c2128; --border:#30363d;
    --text:#e6edf3; --text2:#8b949e; --accent:#58a6ff; --accent2:#1f6feb;
    --green:#3fb950; --orange:#d29922; --purple:#bc8cff; --teal:#39c5cf;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* topnav */
  .topnav{
    position:sticky;top:0;z-index:100;
    background:rgba(13,17,23,.72); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .topnav-inner{
    max-width:1180px;margin:0 auto;padding:12px 24px;
    display:flex;align-items:center;gap:20px;
  }
  .logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .nav-links{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .nav-links a{
    padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text2);transition:.2s;
  }
  .nav-links a:hover{color:var(--text);background:var(--card)}
  .nav-links a.active{color:var(--accent);background:var(--card)}

  /* hero */
  .hero{
    max-width:1180px;margin:0 auto;padding:56px 24px 30px;text-align:center;
  }
  .hero .emoji{font-size:52px;margin-bottom:14px}
  .hero h1{font-size:36px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px}
  .hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--text2);font-size:15.5px;max-width:620px;margin:0 auto 22px}
  .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:20px;font-size:13px;
    background:var(--card);border:1px solid var(--border);color:var(--text2);
  }
  .badge b{color:var(--accent)}

  /* toolbar */
  .toolbar{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;
    border:1px solid var(--border);background:var(--card);color:var(--text);transition:.2s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn.primary:hover{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:wait}
  .scan-status{font-size:12px;color:var(--text2);margin-top:10px;min-height:16px}

  /* hint */
  .hint{
    max-width:1180px;margin:0 auto;padding:0 24px;
    font-size:12.5px;color:var(--text2);text-align:center;margin-bottom:8px;
  }
  .hint b{color:var(--accent)}

  /* sections */
  .wrap{max-width:1180px;margin:0 auto;padding:16px 24px 80px}
  .category{margin-top:32px}
  .cat-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .cat-head .icon{font-size:22px}
  .cat-head h2{font-size:19px;font-weight:700}
  .cat-head .count{margin-left:auto;font-size:13px;color:var(--text2);background:var(--card);padding:3px 10px;border-radius:12px;border:1px solid var(--border)}

  /* cards grid —— App 图标式小方块 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;min-height:60px;
    border-radius:var(--radius);transition:.2s;padding:4px;border:1px dashed transparent}
  .grid.drop-active{border-color:var(--accent);background:rgba(88,166,255,.06)}
  .grid.drop-active .drop-placeholder{display:block}
  .drop-placeholder{display:none;grid-column:1/-1;text-align:center;padding:22px;color:var(--accent);font-size:13px}

  .card{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 8px 12px;transition:.22s;position:relative;cursor:grab;
    min-height:104px;justify-content:flex-start;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);opacity:0;transition:.22s}
  .card:hover::before{opacity:1}
  .card.dragging{opacity:.4;cursor:grabbing}
  .card .grip{position:absolute;right:8px;top:7px;color:var(--text2);font-size:12px;opacity:.35}
  .card .c-emoji{font-size:32px;margin-bottom:8px;line-height:1}
  .card .c-name{
    font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:34px;color:var(--text);
  }
  .card .c-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:16px}
  .tag{padding:1px 7px;border-radius:9px;font-size:10.5px;border:1px solid var(--border);color:var(--text2)}
  .tag.doc{color:var(--teal);border-color:rgba(57,197,207,.4)}
  .tag.inter{color:var(--purple);border-color:rgba(188,140,255,.4)}

  /* inbox（待分类）区 */
  #inbox .cat-head .icon{color:var(--orange)}

  /* empty placeholder */
  .empty{
    grid-column:1/-1;text-align:center;padding:24px;border:1px dashed var(--border);
    border-radius:var(--radius);color:var(--text2);font-size:13px;background:rgba(255,255,255,.02);
  }
  .empty .plus{font-size:22px;display:block;margin-bottom:6px;opacity:.5}

  footer{max-width:1180px;margin:0 auto;padding:30px 24px 60px;text-align:center;color:var(--text2);font-size:12px;border-top:1px solid var(--border)}

  @media(max-width:600px){
    .hero h1{font-size:27px}
    .nav-links{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
    .card{min-height:96px;padding:12px 6px 10px}
    .card .c-emoji{font-size:28px}
  }
</style>
</head>

  <h1 data-page-node-id="P2EXW3LtwpCQU1ns6aSZiQ"><span class="grad" data-page-node-id="KRoUJiODdD7eiTxOCuCcWF">知识脉络</span></h1>
  <p data-page-node-id="nShMYymLKBPu90svLvWHcf">把零散的学习资料串成一张可随时查阅的知识地图。点「仓库检索」拉取仓库里的新教程，再把卡片拖动到下方合适的板块归类。</p>

    <span class="badge" data-page-node-id="cyO8RlN7yEIMLF5quhvFc0">📱 手机可看</span>

<main class="wrap" id="main" data-page-node-id="VHgDaYVy80ISHEIknPIXVw">

<footer data-page-node-id="ExNjvSVwPTJ8bhf3rchzvO">
  知识脉络 · 由 WorkBuddy 生成 · 部署于 GitHub Pages · 支持仓库检索 + 拖拽分类 · 手机浏览器直接访问

<script>
// ===== 配置：改成你自己的 GitHub 信息 =====
var GH_USER = 'lhalex1902';
var GH_REPO  = 'knowledge-site';
var LS_KEY   = 'zhishi-pulse-layout-v1';  // localStorage 键

// 四个固定板块（顺序即显示顺序）
var SECTIONS = [
  {id:'basic', icon:'🧱', name:'基础知识'},
  {id:'dev',   icon:'💻', name:'开发'},
  {id:'test',  icon:'🧪', name:'测试'},
  {id:'memo',  icon:'⚡', name:'速记手册'}
];
var SEC_IDS = SECTIONS.map(function(s){return s.id;});

// 已知文件 → 初始板块映射
var NAME2SEC = {
  '移动端抓包与日志分析实战教程.html':'test',
  'Fiddler抓包工具实操教程.html':'test',
  'ADB工具使用实操教程.html':'test',
  '移动端测试脚本代码交互手册.html':'dev'
};

// 内置元信息库（原 files.json 内容，直接写进代码，无需外部文件）
var META = {
  '移动端测试脚本代码交互手册.html':{
    emoji:'🧰', title:'测试脚本代码交互手册',
    desc:'可交互代码库：Shell / ADB / 抓包 / Python / FiddlerScript 分类，语法高亮、一键复制、命令试玩区。',
    tags:[{cls:'inter',text:'交互'},{cls:'',text:'代码'}]
  },
  '移动端抓包与日志分析实战教程.html':{
    emoji:'📡', title:'抓包与日志分析实战教程',
    desc:'总纲篇：抓包原理、Charles/Fiddler/mitmproxy、安卓/iOS 抓包、Shell、logcat 日志分析、Python 自动化，共 9 章。',
    tags:[{cls:'doc',text:'教程'},{cls:'',text:'抓包'}]
  },
  'Fiddler抓包工具实操教程.html':{
    emoji:'🎯', title:'Fiddler 抓包工具实操教程',
    desc:'半天速成：HTTPS 解密、抓包过滤、断点重放、AutoResponder Mock、FiddlerScript、移动端抓包 6 大模块。',
    tags:[{cls:'doc',text:'教程'},{cls:'',text:'抓包'}]
  },
  'ADB工具使用实操教程.html':{
    emoji:'🤖', title:'ADB 工具使用实操教程',
    desc:'安卓测试核心：设备管理、应用管理、文件传输、logcat 日志抓取与崩溃定位、Shell 调试，7 章 + 速查表。',
    tags:[{cls:'doc',text:'教程'},{cls:'',text:'日志'}]
  }
};

// 全局状态
var LAYOUT = {};      // {basic:[file,...], dev:[...], test:[...], memo:[...], inbox:[...]}

// ===== 转义 =====
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ===== 初始化 layout：优先读 localStorage，否则按 NAME2SEC 迁移 =====
function initLayout(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(saved && typeof saved === 'object'){
    var base = {basic:[],dev:[],test:[],memo:[],inbox:[]};
    SEC_IDS.forEach(function(id){ base[id] = Array.isArray(saved[id]) ? saved[id] : []; });
    base.inbox = Array.isArray(saved.inbox) ? saved.inbox : [];
    return base;
  }
  var layout = {basic:[],dev:[],test:[],memo:[],inbox:[]};
  Object.keys(META).forEach(function(file){
    var sec = NAME2SEC[file] || 'inbox';
    layout[sec].push(file);
  });
  return layout;
}
function saveLayout(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LAYOUT)); }catch(e){}
}

// ===== 统计总数 =====
function totalCount(){
  var n = 0;
  SEC_IDS.forEach(function(id){ n += LAYOUT[id].length; });
  return n;
}

// ===== 渲染单个卡片（App 图标式） =====
function cardHtml(file){
  var m = META[file] || {};
  var title = m.title || file.replace(/\.html?$/i,'');
  var emoji = m.emoji || '📄';
  var tags = (m.tags || []).map(function(t){
    var cls = t.cls ? (' class="'+esc(t.cls)+'"') : '';
    return '<span class="tag'+cls+'">'+esc(t.text)+'</span>';
  }).join('');
  return '<a class="card" draggable="true" data-file="'+esc(file)+'" href="'+esc(file)+'" title="'+esc(title)+'">'+
      '<span class="grip">⠿</span>'+
      '<div class="c-emoji">'+esc(emoji)+'</div>'+
      '<div class="c-name">'+esc(title)+'</div>'+
      '<div class="c-tags">'+tags+'</div>'+
    '</a>';
}

// ===== 渲染整个页面 =====
function render(){
  var main = document.getElementById('main');
  var nav = document.getElementById('navLinks');
  var html = '';
  var navHtml = '';

  // 四个固定板块
  SECTIONS.forEach(function(sec){
    var files = LAYOUT[sec.id] || [];
    navHtml += '<a href="#sec-'+sec.id+'">'+esc(sec.name)+'</a>';
    html += '<section class="category" id="sec-'+sec.id+'" data-sec="'+sec.id+'">';
    html += '<div class="cat-head">';
    html += '<span class="icon">'+sec.icon+'</span>';
    html += '<h2>'+esc(sec.name)+'</h2>';
    html += '<span class="count">'+files.length+' 份</span>';
    html += '</div>';
    html += '<div class="grid" data-sec="'+sec.id+'">';
    if(files.length === 0){
      html += '<div class="empty"><span class="plus">＋</span>把卡片拖到这里，或点「仓库检索」拉取新教程</div>';
    } else {
      files.forEach(function(f){ html += cardHtml(f); });
    }
    html += '<div class="drop-placeholder">松开鼠标，放到「'+esc(sec.name)+'」</div>';
    html += '</div></section>';
  });

  // 待分类区（inbox）
  var inbox = LAYOUT.inbox || [];
  navHtml += '<a href="#inbox">待分类</a>';
  html += '<section class="category" id="inbox" data-sec="inbox">';
  html += '<div class="cat-head">';
  html += '<span class="icon">📥</span>';
  html += '<h2>待分类</h2>';
  html += '<span class="count">'+inbox.length+' 个</span>';
  html += '</div>';
  html += '<div class="grid" data-sec="inbox">';
  if(inbox.length === 0){
    html += '<div class="empty"><span class="plus">∅</span>点「仓库检索」拉取仓库里的新教程，会出现在这里等你归类</div>';
  } else {
    inbox.forEach(function(f){ html += cardHtml(f); });
  }
  html += '<div class="drop-placeholder">松开鼠标，放回待分类</div>';
  html += '</div></section>';

  main.innerHTML = html;
  nav.innerHTML = navHtml;
  document.getElementById('totalCount').textContent = totalCount();
  bindDnD();
  bindScrollSpy();
}

// ===== 拖拽逻辑 =====
var DRAG_FILE = null;
function bindDnD(){
  var cards = document.querySelectorAll('.card');
  var grids = document.querySelectorAll('.grid');

  cards.forEach(function(c){
    c.addEventListener('dragstart', function(e){
      DRAG_FILE = c.getAttribute('data-file');
      c.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', DRAG_FILE); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
    });
    c.addEventListener('dragend', function(){
      c.classList.remove('dragging');
      DRAG_FILE = null;
    });
  });

  grids.forEach(function(g){
    g.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      g.classList.add('drop-active');
    });
    g.addEventListener('dragleave', function(e){
      if(e.target === g) g.classList.remove('drop-active');
    });
    g.addEventListener('drop', function(e){
      e.preventDefault();
      g.classList.remove('drop-active');
      var file = DRAG_FILE;
      try{ file = e.dataTransfer.getData('text/plain') || file; }catch(err){}
      if(!file) return;
      moveTo(e.currentTarget.getAttribute('data-sec'), file);
    });
  });
}

// 把 file 移到目标板块（toSec）
function moveTo(toSec, file){
  SEC_IDS.forEach(function(id){
    var i = LAYOUT[id].indexOf(file);
    if(i !== -1){ LAYOUT[id].splice(i,1); }
  });
  var ii = LAYOUT.inbox.indexOf(file);
  if(ii !== -1){ LAYOUT.inbox.splice(ii,1); }

  if(SEC_IDS.indexOf(toSec) !== -1){
    LAYOUT[toSec].push(file);
  } else if(toSec === 'inbox'){
    if(LAYOUT.inbox.indexOf(file) === -1) LAYOUT.inbox.push(file);
  }
  saveLayout();
  render();
}

// ===== 导航滚动高亮 =====
function bindScrollSpy(){
  var sections = document.querySelectorAll('section[id]');
  var links = document.querySelectorAll('#navLinks a');
  window.addEventListener('scroll', function(){
    var cur = '';
    sections.forEach(function(s){
      if(window.scrollY >= s.offsetTop - 90) cur = s.getAttribute('id');
    });
    links.forEach(function(a){
      a.classList.toggle('active', a.getAttribute('href') === '#' + cur);
    });
  });
}

// ===== 仓库检索：拉取仓库里的 HTML，未归类的放进待分类区 =====
function scanRepo(){
  var btn = document.getElementById('scanBtn');
  var status = document.getElementById('scanStatus');
  btn.disabled = true;
  status.textContent = '🔍 正在扫描仓库 ' + GH_USER + '/' + GH_REPO + ' ...';

  var apiUrl = 'https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/?ref=main';
  fetch(apiUrl, {headers:{'Accept':'application/vnd.github+json'}})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(files){
      var added = 0;
      files.forEach(function(f){
        if(f.type === 'file' && /\.html?$/i.test(f.name)){
          var name = decodeURIComponent(f.name);
          // 登记元信息（若内置 META 没有，用文件名兜底）
          if(!META[name]){
            META[name] = {
              emoji:'📄',
              title:name.replace(/\.html?$/i,''),
              desc:'仓库中的教程文件，点击打开。',
              tags:[{cls:'',text:'仓库文件'}]
            };
          }
          // 若尚未归入任何板块，放进待分类区
          var placed = false;
          SEC_IDS.forEach(function(id){ if(LAYOUT[id].indexOf(name)!==-1) placed=true; });
          if(!placed && LAYOUT.inbox.indexOf(name) === -1){
            LAYOUT.inbox.push(name);
            added++;
          }
        }
      });
      saveLayout();
      render();
      if(added === 0){
        status.textContent = '✅ 扫描完成：没有发现新文件（仓库里的 HTML 都已归类或在待分类区）。';
      } else {
        status.textContent = '✅ 发现 ' + added + ' 个新文件，已放入「📥 待分类」区。拖动卡片到上方板块即可归类。';
      }
    })
    .catch(function(err){
      status.textContent = '⚠️ 检索失败：' + err.message + '（可能是网络或 API 速率限制，稍后再试）。';
    })
    .then(function(){ btn.disabled = false; });
}

// ===== 启动 =====
LAYOUT = initLayout();
render();
</script>
