<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="d1iZ4ab9rwgTjr9dBS0jyK">
<head data-page-node-id="mDU4S3o7BzDDmXdqKextpL">
<meta charset="UTF-8" data-page-node-id="QlhthLp9UGJsWUase3OxeR">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="tEzJ4qkMQVQRTtHOXUCHN0">
<title>每日速览</title>
<style>
  :root{
    --bg:#0f1220; --bg2:#151a2e; --card:#1b2138; --card2:#222a45;
    --ink:#eef1fb; --muted:#9aa6c8; --line:#2c3552;
    --c1:#7c9cff; --c2:#9d7bff; --green:#39d98a; --amber:#ffb454; --red:#ff6b6b;
    --grad:linear-gradient(120deg,#7c9cff,#9d7bff 55%,#c77bff);
    --grad-hot:linear-gradient(120deg,#ff8a5c,#ff6b6b 55%,#ff5c8a);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1c2450 0,transparent 60%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 80px}

  /* Hero */
  .hero{padding:40px 0 18px;position:relative}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:2px;color:var(--c1);
    text-transform:uppercase;font-weight:700;background:rgba(124,156,255,.1);border:1px solid rgba(124,156,255,.25);
    padding:5px 12px;border-radius:20px;margin-bottom:14px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(120deg,#fff,#c7d2ff 60%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .date{color:var(--muted);font-size:15px;margin:0 0 6px}
  .hero .date b{color:var(--ink)}

  /* Nav */
  .nav{position:sticky;top:0;z-index:30;background:rgba(15,18,32,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);margin:0 -18px 24px;padding:10px 18px}
  .nav-inner{max-width:1120px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav a{flex:none;font-size:13px;font-weight:600;color:var(--muted);padding:7px 13px;border-radius:20px;
    border:1px solid transparent;white-space:nowrap;transition:all .18s;display:flex;align-items:center;gap:6px}
  .nav a:hover{color:var(--ink);background:var(--card)}
  .nav a.on{color:#fff;background:var(--grad);border-color:transparent}
  .nav a .cnt{font-size:11px;opacity:.75;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:10px}

  /* Section */
  section{margin-top:34px;scroll-margin-top:64px}
  .sec-h{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .sec-h .bar{width:5px;height:22px;border-radius:3px;background:var(--grad)}
  .sec-h.hot .bar{background:var(--grad-hot)}
  .sec-h h2{font-size:19px;margin:0;font-weight:800}
  .sec-h .count{font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:14px}

  /* Card grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(165deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
  .card:hover{transform:translateY(-3px);border-color:rgba(124,156,255,.4)}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);opacity:.7}
  .card.hot::before{background:var(--grad-hot)}
  .c-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .c-num{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(124,156,255,.14);color:var(--c1);
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .card.hot .c-num{background:rgba(255,138,92,.16);color:#ff9d7a}
  .c-chip{font-size:11.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.06);
    border:1px solid var(--line);padding:3px 9px;border-radius:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-title{font-size:15.5px;font-weight:700;margin:0 0 8px;line-height:1.45;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .c-sum{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.65;flex:1;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
  .c-link{font-size:12.5px;font-weight:700;color:var(--c1);display:inline-flex;align-items:center;gap:5px}
  .c-link:hover{color:#a9bcff}
  .c-link svg{width:13px;height:13px}
  .c-hot{font-size:12px;font-weight:700;color:#ff9d7a;white-space:nowrap}

  /* Hot list (compact rows) for 60s news & zhihu */
  .list{display:flex;flex-direction:column;gap:2px;background:linear-gradient(165deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:16px;padding:6px 8px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;transition:background .15s}
  .row:hover{background:rgba(124,156,255,.07)}
  .row .rnum{flex:none;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:800;
    background:rgba(255,138,92,.14);color:#ff9d7a;display:flex;align-items:center;justify-content:center}
  .row .rt{flex:1;font-size:14.5px;font-weight:600;line-height:1.45;min-width:0}
  .row .rt small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.55;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .row .rh{flex:none;font-size:12px;font-weight:700;color:#ff9d7a;white-space:nowrap}
  .row a.rt{color:inherit}
  .row a.rt:hover{color:var(--c1)}

  /* 60s news plain text list */
  .newslist{background:linear-gradient(165deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:8px 10px}
  .newslist .nrow{display:flex;gap:11px;padding:10px 8px;border-radius:10px;transition:background .15s}
  .newslist .nrow:hover{background:rgba(124,156,255,.06)}
  .newslist .nnum{flex:none;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:800;
    background:rgba(57,217,138,.15);color:var(--green);display:flex;align-items:center;justify-content:center}
  .newslist .nt{font-size:14.5px;color:#dbe2fb;line-height:1.55}

  /* cover thumb */
  .c-cover{flex:none;width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg2);border:1px solid var(--line)}

  footer{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12.5px}
  footer b{color:var(--ink)}
  footer a{color:var(--c1);border-bottom:1px dashed rgba(124,156,255,.4)}

  .loading{padding:60px 20px;text-align:center;color:var(--muted)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--c1);border-radius:50%;
    animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{padding:50px 20px;text-align:center;color:var(--red)}
  .err button{margin-top:14px;background:var(--grad);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-weight:700;cursor:pointer}
  .lead{background:linear-gradient(135deg,rgba(124,156,255,.1),rgba(157,123,255,.08));border:1px solid rgba(124,156,255,.22);
    border-radius:14px;padding:14px 16px;margin-top:16px;font-size:14px;color:#cdd6f5}
  .lead b{color:#fff}
  .band{display:flex;align-items:center;gap:10px;margin:40px 0 4px;padding:12px 16px;border-radius:14px;
    background:linear-gradient(120deg,rgba(255,138,92,.12),rgba(255,92,138,.08));border:1px solid rgba(255,138,92,.25)}
  .band .b-ico{font-size:20px}
  .band .b-t{font-size:16px;font-weight:800}
  .band .b-s{font-size:12.5px;color:var(--muted);margin-left:auto}
</style>
</head>

  <nav class="nav" data-page-node-id="nmwKjpbI9ZjskGH3CvO3YB"><div class="nav-inner" id="nav" data-page-node-id="9pgc7Kj2uvFjjdSaDz4mhi"></div></nav>
  <main id="main" data-page-node-id="b3Tk0yOD5MXkQAicClA5rj">
    <div class="loading" data-page-node-id="EJyRi2jzf2FTEPCf8tDhBK"><div class="spinner" data-page-node-id="duLOD9wiBZkGHbJcRZ0a8S"></div><div data-page-node-id="z37xcgkeHXH7STa2gkCIuO">正在拉取今日 AI 日报与全网热搜…</div></div>
  </main>
  <footer id="footer" data-page-node-id="wc4TjIxqfNwIrZyqkA5CrL"></footer>

<script>
/* =========================================================================
   今日速览仪表盘 — 单文件，浏览器直连多个公开接口
   · AI 晨报：https://aihot.virxact.com/api/public/daily （CORS:*）
   · 全网热搜：https://60s.viki.moe/v2/{douyin|weibo|zhihu|60s} （CORS:*）
   任一源失败不影响其他源渲染。ES5 兼容写法。
   ========================================================================= */
var DAILY_API = 'https://aihot.virxact.com/api/public/daily';
var HOT_API   = 'https://60s.viki.moe/v2/';

// AI 五版块固定顺序与锚点 id
var SECTIONS = [
  {label:'模型发布/更新', anchor:'models'},
  {label:'产品发布/更新', anchor:'products'},
  {label:'行业动态',     anchor:'industry'},
  {label:'论文研究',     anchor:'paper'},
  {label:'技巧与观点',   anchor:'tip'}
];

// 全网热搜源（有则渲染，失败/空则隐藏）
var HOT_SOURCES = [
  {key:'douyin', label:'抖音热搜', anchor:'hot-douyin', icon:'🎵', per:20, withCover:true},
  {key:'weibo',  label:'微博热搜', anchor:'hot-weibo',  icon:'🔥', per:20, withCover:false},
  {key:'zhihu',  label:'知乎热榜', anchor:'hot-zhihu',  icon:'💡', per:15, withCover:false, listStyle:'zhihu'},
  {key:'60s',    label:'60秒早报', anchor:'hot-60s',    icon:'📰', per:15, withCover:false, listStyle:'news'}
];

/* ---------- 工具 ---------- */
function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function trimSum(s, n){n=n||60;s=String(s||'').trim();return s.length>n ? s.slice(0,n)+'…' : s;}
function srcChip(name){name=String(name||'');return (name.split(/[：:]/)[0]||name).trim()||'未知来源';}
function hotNum(v){
  v=Number(v||0); if(!v) return '';
  if(v>=100000000) return (v/100000000).toFixed(1)+'亿';
  if(v>=10000) return (v/10000).toFixed(1)+'万';
  return String(v);
}
function toBJHuman(iso){
  if(!iso) return '';
  var d = new Date(iso);
  var bj = new Date(d.getTime() + 8*3600*1000);
  var now = new Date();
  var diffMs = now - d;
  var diffH = Math.floor(diffMs/3600000);
  var hh = bj.getUTCHours();
  var mm = ('0'+bj.getUTCMinutes()).slice(-2);
  var period = hh<6?'凌晨':(hh<12?'上午':(hh<13?'中午':(hh<18?'下午':'晚上')));
  var h12 = hh%12; if(h12===0) h12=12;
  var rel = diffH<1 ? '刚刚' : (diffH<24 ? diffH+' 小时前' : '');
  var abs = (bj.getUTCMonth()+1)+'月'+bj.getUTCDate()+'日 '+period+h12+':'+mm;
  return rel ? (abs+'（'+rel+'）') : abs;
}
function bjDateHuman(dateStr){
  if(!dateStr) return '';
  var p=dateStr.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return p[0]+' 年 '+(+p[1])+' 月 '+(+p[2])+' 日 · '+wk;
}

/* ---------- AI 晨报渲染 ---------- */
function renderAI(data){
  var sections = Array.isArray(data.sections) ? data.sections : [];
  var map={};
  sections.forEach(function(s){ map[s.label]=s.items||[]; });
  renderHero(data, map);
  renderNav(map);
  renderAIBody(map);
  renderFooter(data);
}

function renderHero(data, map){
  var gen = toBJHuman(data.generatedAt);
  var leadHtml = '';
  if(data.lead && data.lead.title){
    leadHtml = '<div class="lead"><b>主编点评 · </b>'+escapeHtml(data.lead.title)+
      (data.lead.leadParagraph?(' — '+escapeHtml(data.lead.leadParagraph)):'')+'</div>';
  }
  $('hero').innerHTML =
    '<div class="kicker"><span class="dot"></span>DAILY BRIEFING</div>'+
    '<h1>每日速览</h1>'+
    '<p class="date"><b>'+bjDateHuman(data.date)+'</b>'+(gen?(' · 生成于 '+gen):'')+'</p>'+leadHtml;
}

function renderNav(aiMap){
  // 顶部只保留 5 个按钮：AI 晨报 + 四个热搜源
  var html='';
  html+='<a href="#band-ai" data-anchor="band-ai">🤖 AI 晨报</a>';
  HOT_SOURCES.forEach(function(s){
    html+='<a href="#'+s.anchor+'" data-anchor="'+s.anchor+'">'+s.icon+' '+s.label+'</a>';
  });
  $('nav').innerHTML=html;
}

function renderAIBody(map){
  var main=$('main'); main.innerHTML='';

  // AI 分组带
  var bandAI=document.createElement('div');
  bandAI.className='band'; bandAI.id='band-ai';
  bandAI.innerHTML='<span class="b-ico">🤖</span><span class="b-t">AI 晨报 · 五版块</span>'+
    '<span class="b-s">来源：AI HOT 每日日报</span>';
  main.appendChild(bandAI);

  var idx=0;
  SECTIONS.forEach(function(s){
    var items=map[s.label]||[];
    var sec=document.createElement('section');
    sec.id=s.anchor;
    var cards='';
    items.forEach(function(it){
      idx++;
      var url=it.sourceUrl || it.permalink || '#';
      cards +=
        '<article class="card">'+
          '<div class="c-top"><span class="c-num">'+idx+'</span>'+
            '<span class="c-chip">'+escapeHtml(srcChip(it.sourceName))+'</span></div>'+
          '<h3 class="c-title">'+escapeHtml(it.title||'（无标题）')+'</h3>'+
          '<p class="c-sum">'+escapeHtml(trimSum(it.summary,140))+'</p>'+
          '<div class="c-foot">'+
            '<span class="c-chip" style="max-width:60%">'+escapeHtml(it.sourceName||'')+'</span>'+
            '<a class="c-link" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">原文'+
              '<svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
            '</a>'+
          '</div>'+
        '</article>';
    });
    sec.innerHTML='<div class="sec-h"><span class="bar"></span><h2>'+s.label+'</h2>'+
      '<span class="count">'+items.length+' 条</span></div>'+
      '<div class="grid">'+cards+'</div>';
    main.appendChild(sec);
  });

  // 全网热搜分组带
  var bandHot=document.createElement('div');
  bandHot.className='band'; bandHot.id='band-hot';
  bandHot.innerHTML='<span class="b-ico">🔥</span><span class="b-t">全网热搜 · 实时热榜</span>'+
    '<span class="b-s">来源：60s 聚合（抖音/微博/知乎/早报）</span>';
  main.appendChild(bandHot);

  // 热搜占位容器（由 renderHot 填充）
  HOT_SOURCES.forEach(function(s){
    var sec=document.createElement('section');
    sec.id=s.anchor;
    sec.innerHTML='<div class="sec-h hot"><span class="bar"></span><h2>'+s.icon+' '+s.label+'</h2>'+
      '<span class="count" id="cnt-'+s.anchor+'">加载中…</span></div>'+
      '<div id="body-'+s.anchor+'"><div class="loading" style="padding:26px"><div class="spinner"></div></div></div>';
    main.appendChild(sec);
  });
}

function renderFooter(data){
  var src=(data.attribution && data.attribution.canonical) ? data.attribution.canonical : 'https://aihot.virxact.com';
  $('footer').innerHTML=
    'AI 晨报数据来源：<a href="'+escapeHtml(src)+'" target="_blank" rel="noopener noreferrer">AI HOT（aihot.virxact.com）</a><br>'+
    '热搜数据来源：<a href="https://60s.viki.moe" target="_blank" rel="noopener noreferrer">60s 聚合（60s.viki.moe）</a> · 各平台原链接可点击跳转<br>'+
    '<span style="opacity:.7">由「每日速览」仪表盘生成 · 时间均为北京时间</span>';
}

/* ---------- 全网热搜渲染 ---------- */
function renderHotSource(cfg, resp){
  var body=$('body-'+cfg.anchor);
  var cnt=$('cnt-'+cfg.anchor);
  if(!body) return;
  var arr=[];
  if(resp && resp.code===200 && Array.isArray(resp.data)){ arr=resp.data; }
  if(!arr.length){
    if(cnt) cnt.textContent='暂无';
    body.innerHTML='<div class="err" style="padding:24px">该榜单暂时没有可用数据（源接口可能限流或返回为空）。</div>';
    return;
  }
  var per=cfg.per||20;
  var items=arr.slice(0,per);
  if(cnt) cnt.textContent=items.length+' / '+arr.length+' 条';

  if(cfg.listStyle==='news'){
    // 60秒早报：纯文本编号列表
    var rows='';
    items.forEach(function(it,i){
      rows+='<div class="nrow"><span class="nnum">'+(i+1)+'</span><span class="nt">'+escapeHtml(it.title||it)+'<\/span></div>';
    });
    body.innerHTML='<div class="newslist">'+rows+'</div>';
    return;
  }

  if(cfg.listStyle==='zhihu'){
    // 知乎：标题 + detail 摘要 + 热度
    var zrows='';
    items.forEach(function(it,i){
      var url=it.link||'#';
      var det=it.detail||it.excerpt||'';
      var hv=it.hot_value_desc||hotNum(it.hot_value);
      zrows+=
        '<div class="row">'+
          '<span class="rnum">'+(i+1)+'</span>'+
          '<a class="rt" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(it.title||'（无标题）')+
            (det?'<small>'+escapeHtml(trimSum(det,160))+'</small>':'')+'</a>'+
          (hv?'<span class="rh">'+escapeHtml(hv)+'</span>':'')+
        '</div>';
    });
    body.innerHTML='<div class="list">'+zrows+'</div>';
    return;
  }

  // 抖音/微博：卡片网格，含封面与热度
  var cards='';
  items.forEach(function(it,i){
    var url=it.link||'#';
    var cover=cfg.withCover && it.cover ? it.cover : '';
    var hv=hotNum(it.hot_value);
    var et=it.event_time||it.active_time||'';
    var titleHtml = cover
      ? '<div style="display:flex;gap:12px;align-items:flex-start">'+
          '<img class="c-cover" src="'+escapeHtml(cover)+'" loading="lazy" onerror="this.style.display=\'none\'">'+
          '<div style="flex:1;min-width:0">'+
            '<h3 class="c-title" style="margin-bottom:6px">'+escapeHtml(it.title||'（无标题）')+'</h3>'+
            (et?'<p class="c-sum" style="margin:0">'+escapeHtml(et)+'</p>':'')+
          '</div></div>'
      : '<h3 class="c-title">'+escapeHtml(it.title||'（无标题）')+'</h3>';
    cards +=
      '<article class="card hot">'+
        '<div class="c-top"><span class="c-num">'+(i+1)+'</span>'+
          '<span class="c-chip">'+escapeHtml(cfg.label)+'</span>'+
          (hv?'<span class="c-hot" style="margin-left:auto">🔥 '+escapeHtml(hv)+'</span>':'')+'</div>'+
        titleHtml+
        '<div class="c-foot">'+
          '<span class="c-chip" style="max-width:60%">热度 '+escapeHtml(hv||'-')+'</span>'+
          '<a class="c-link" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">查看'+
            '<svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
          '</a>'+
        '</div>'+
      '</article>';
  });
  body.innerHTML='<div class="grid">'+cards+'</div>';
}

/* ---------- 导航高亮（滚动同步） ---------- */
function setupSpy(){
  var links=$('nav').querySelectorAll('a');
  var secs=[];
  Array.prototype.forEach.call(links,function(a){
    var id=a.getAttribute('data-anchor');
    var el=$(id); if(el) secs.push({a:a,el:el});
  });
  function onScroll(){
    var pos=window.scrollY+90; var cur=null;
    secs.forEach(function(s){ if(s.el.offsetTop<=pos) cur=s; });
    Array.prototype.forEach.call(links,function(a){a.classList.remove('on');});
    if(cur) cur.a.classList.add('on');
  }
  window.addEventListener('scroll',onScroll,{passive:true}); onScroll();
}

/* ---------- 取数 ---------- */
function fetchJSON(url){
  return fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
// 带超时的 fetch（防止某源挂起拖慢整页）
function fetchJSONTO(url, ms){
  return new Promise(function(resolve,reject){
    var done=false;
    var t=setTimeout(function(){ if(!done){done=true; reject(new Error('timeout'));} }, ms||12000);
    fetchJSON(url).then(function(d){ if(!done){done=true; clearTimeout(t); resolve(d);} })
      .catch(function(e){ if(!done){done=true; clearTimeout(t); reject(e);} });
  });
}

function loadAI(){
  fetchJSONTO(DAILY_API, 15000).then(function(d){
    if(d && (d.sections||[]).length){ renderAI(d); setupSpy(); }
    else { $('main').innerHTML='<div class="err">⚠️ 今日 AI 日报暂未生成或无可用数据。<div><button onclick="location.reload()">重新加载</button></div></div>'; }
  }).catch(function(e){
    // 回退：拉最近一期
    fetchJSONTO(DAILY_API.replace('/daily','/dailies')+'?take=3', 12000).then(function(list){
      var items=(list && list.items) ? list.items : (Array.isArray(list)?list:[]);
      if(items.length && items[0].date){ return fetchJSONTO(DAILY_API+'/'+items[0].date, 12000); }
      throw e;
    }).then(function(d){ renderAI(d); setupSpy(); }).catch(function(){
      // AI 失败时仍保留热搜区：渲染空 AI 提示
      renderAI({date:'', sections:[], generatedAt:''});
      setupSpy();
    });
  });
}

function loadHot(){
  // 并行拉取所有热搜源，各自独立渲染，互不影响
  HOT_SOURCES.forEach(function(cfg){
    fetchJSONTO(HOT_API+cfg.key, 12000).then(function(resp){
      renderHotSource(cfg, resp);
    }).catch(function(){
      renderHotSource(cfg, null); // 失败 → 显示暂无
    });
  });
}

/* ---------- 启动 ---------- */
loadAI();
loadHot();
</script>
