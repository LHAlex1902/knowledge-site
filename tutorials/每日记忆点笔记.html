<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>每日记忆点 · 笔记收集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --card:#1c2128; --card2:#21262d;
    --border:#30363d; --text:#e6edf3; --text2:#8b949e;
    --accent:#58a6ff; --accent2:#1f6feb; --green:#3fb950;
    --orange:#d29922; --purple:#bc8cff; --teal:#39c5cf; --red:#f85149;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(680px 420px at 10% -5%, rgba(31,111,235,.14), transparent 60%),
      radial-gradient(620px 460px at 92% 8%, rgba(188,140,255,.12), transparent 62%),
      radial-gradient(720px 520px at 50% 110%, rgba(57,197,207,.07), transparent 60%);
    background-attachment:fixed;
    min-height:100vh;
  }
  ::selection{background:rgba(88,166,255,.32);color:#fff}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#2b323c;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#3a434f}

  /* topnav */
  .topnav{
    position:sticky;top:0;z-index:100;
    background:rgba(13,17,23,.78); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 rgba(88,166,255,.08),0 4px 20px rgba(0,0,0,.28);
  }
  .topnav-inner{
    max-width:1080px;margin:0 auto;padding:12px 24px;
    display:flex;align-items:center;gap:16px;
  }
  .logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .sync-status{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px}
  .sync-status .sdot{width:8px;height:8px;border-radius:50%;background:var(--text2)}
  .sync-status.ok .sdot{background:var(--green);box-shadow:0 0 8px var(--green)}
  .sync-status.off .sdot{background:var(--orange)}
  .sync-status.err .sdot{background:var(--red)}
  .btn{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;
    border:1px solid var(--border);background:var(--card);color:var(--text);transition:.18s;
    font-family:inherit;
  }
  .btn:hover{border-color:var(--accent);background:var(--card2)}
  .btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 11px;font-size:12.5px}

  .wrap{max-width:1080px;margin:0 auto;padding:30px 24px 80px}

  /* hero */
  .hero{text-align:center;padding:26px 0 22px}
  .hero .emoji{font-size:46px;margin-bottom:10px}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
  .hero h1 .grad{
    background:linear-gradient(100deg,var(--accent) 0%,#79c0ff 40%,var(--purple) 80%,#d2a8ff 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 2px 16px rgba(88,166,255,.25));
  }
  .hero p{color:var(--text2);font-size:14.5px;max-width:560px;margin:0 auto}

  /* 输入卡片 */
  .input-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:34px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .input-card h2{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .input-card h2 .bar{width:4px;height:18px;border-radius:3px;background:linear-gradient(var(--accent),var(--purple))}
  textarea#content{
    width:100%;min-height:96px;resize:vertical;
    background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:13px 15px;font-size:15px;line-height:1.65;
    font-family:inherit;transition:.18s;
  }
  textarea#content:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.15)}
  .input-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--text2);font-weight:600;padding-left:2px}
  select#typeSel{
    background:var(--bg2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:9px 13px;font-size:14px;font-family:inherit;cursor:pointer;transition:.18s;
    min-width:150px;
  }
  select#typeSel:focus{outline:none;border-color:var(--accent)}
  .type-manage{display:flex;gap:8px;align-items:flex-end}
  .input-row .grow{flex:1;min-width:120px}
  .save-wrap{margin-left:auto}
  .hint{font-size:12px;color:var(--text2);margin-top:10px}
  .hint b{color:var(--orange)}

  /* 类型管理弹窗 */
  .modal{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal.show{display:flex}
  .modal-box{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-box h3{font-size:17px;margin-bottom:6px}
  .modal-box p{font-size:13px;color:var(--text2);margin-bottom:16px}
  .modal-box input{
    width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:10px 13px;font-size:14px;font-family:inherit;margin-bottom:12px;
  }
  .modal-box input:focus{outline:none;border-color:var(--accent)}
  .type-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .type-chip{
    display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;
    background:var(--card2);border:1px solid var(--border);font-size:13px;
  }
  .type-chip .del{cursor:pointer;color:var(--text2);font-weight:700;font-size:15px;line-height:1}
  .type-chip .del:hover{color:var(--red)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}

  /* 分组展示 */
  .sec-title{
    font-size:18px;font-weight:800;margin:0 0 18px;display:flex;align-items:center;gap:10px;
  }
  .sec-title .bar{width:4px;height:20px;border-radius:3px;background:linear-gradient(var(--accent),var(--purple))}
  .sec-title .count{font-size:13px;color:var(--text2);font-weight:600}

  .group{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:16px;overflow:hidden;transition:.18s;
  }
  .group-head{
    display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;
    background:var(--card2);user-select:none;
  }
  .group-head:hover{background:#262c36}
  .group-head .gname{font-weight:700;font-size:15.5px;flex:1;display:flex;align-items:center;gap:9px}
  .group-head .gcount{
    font-size:12.5px;color:var(--text2);background:var(--bg2);
    border:1px solid var(--border);border-radius:20px;padding:2px 11px;
  }
  .group-head .gtools{display:flex;gap:6px;align-items:center}
  .icon-btn{
    cursor:pointer;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text2);display:inline-flex;align-items:center;justify-content:center;
    font-size:14px;transition:.15s;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--accent)}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed}
  .chev{transition:transform .25s;color:var(--text2);font-size:13px}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group.collapsed .group-body{display:none}
  .group-body{padding:6px 14px 14px}

  .note-item{
    display:flex;gap:13px;padding:13px 14px;border-radius:10px;
    background:var(--bg2);border:1px solid var(--border);margin-top:10px;transition:.15s;
    position:relative;
  }
  .note-item:hover{border-color:#3d444d}
  .note-no{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  }
  .note-main{flex:1;min-width:0}
  .note-content{font-size:14.5px;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .note-time{font-size:12px;color:var(--text2);margin-top:6px}
  .note-del{
    flex-shrink:0;cursor:pointer;color:var(--text2);font-size:18px;line-height:1;
    background:none;border:none;padding:2px 4px;border-radius:6px;transition:.15s;align-self:flex-start;
  }
  .note-del:hover{color:var(--red);background:rgba(248,81,73,.12)}

  .empty{text-align:center;color:var(--text2);padding:40px 20px;font-size:14px}
  .empty .e-emoji{font-size:40px;display:block;margin-bottom:10px;opacity:.7}

  /* toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:10px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.3s;z-index:300;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--green)}
  .toast.err{border-color:var(--red)}

  @media(max-width:640px){
    .wrap{padding:20px 14px 70px}
    .hero h1{font-size:24px}
    .input-row{flex-direction:column;align-items:stretch}
    .save-wrap{margin-left:0}
    .save-wrap .btn{width:100%;justify-content:center}
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="logo"><span class="dot"></span>📝 每日记忆点</div>
    <div class="nav-right">
      <span class="sync-status" id="syncStatus"><span class="sdot"></span><span id="syncText">未同步</span></span>
      <button class="btn sm" onclick="pullCloud()">🔄 同步</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="emoji">📝</div>
    <h1><span class="grad">每日记忆点收集</span></h1>
    <p>随手记下每天的收获与记忆点，选好类型一键保存到 GitHub 数据表。下方按类型分类展示，可展开收起、上下移动。</p>
  </div>

  <!-- 上半部分：输入区 -->
  <div class="input-card">
    <h2><span class="bar"></span>✍️ 记录一条记忆点</h2>
    <textarea id="content" placeholder="把今天的收获、要记的知识点、易错点……随手写在这里。"></textarea>
    <div class="input-row">
      <div class="field">
        <label>类型</label>
        <select id="typeSel"></select>
      </div>
      <div class="type-manage">
        <div class="field" style="margin:0">
          <label>&nbsp;</label>
          <button class="btn sm ghost" onclick="openTypeModal()">＋ 管理类型</button>
        </div>
      </div>
      <div class="save-wrap">
        <button class="btn primary" onclick="saveNote()">💾 保存</button>
      </div>
    </div>
    <div class="hint">💡 快捷键：<b>Ctrl/⌘ + Enter</b> 快速保存。未设置令牌时会先存到本机，联网设置令牌后自动上传。</div>
  </div>

  <!-- 下半部分：分类展示 -->
  <div class="sec-title"><span class="bar"></span>📚 按类型浏览 <span class="count" id="totalCnt"></span></div>
  <div id="groups"></div>
</div>

<!-- 类型管理弹窗 -->
<div class="modal" id="typeModal">
  <div class="modal-box">
    <h3>管理类型</h3>
    <p>添加新类型，或删除已有类型（删除类型不会删除其下的笔记）。</p>
    <div class="type-list" id="typeList"></div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="newTypeInput" placeholder="新类型名称，如：高数、英语、测试…" style="flex:1;margin:0" onkeydown="if(event.key==='Enter')addType()">
      <button class="btn sm primary" onclick="addType()">添加</button>
    </div>
    <div class="modal-actions">
      <button class="btn sm ghost" onclick="closeTypeModal()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   配置
   ============================================================ */
var GH_USER = 'lhalex1902';
var GH_REPO = 'knowledge-site';
var SYNC_BRANCH = 'main';
var DATA_FILE = 'notes-data.json';
var LS_DATA  = 'mry-note-data-v1';     // 本机数据兜底
var LS_TOKEN = 'zhishi-pulse-token-v1';// 复用 index 页面的 GitHub PAT
var LS_TYPES = 'mry-note-types-v1';    // 类型列表
var LS_COLLAPSE = 'mry-note-collapse-v1'; // 分组折叠状态

/* ============================================================
   状态
   ============================================================ */
var state = { notes: [], types: [], nextNo: 1 };
var collapse = {};  // {类型名: true(收起)/false(展开)}

/* ============================================================
   工具
   ============================================================ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function b64ToUtf8(b){ return decodeURIComponent(Array.prototype.map.call(atob(b),function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join('')); }
function utf8ToB64(s){ return btoa(unescape(encodeURIComponent(s))); }
function nowStr(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function toast(msg,kind){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(kind?(' '+kind):'');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.className='toast'+(kind?(' '+kind):''); },2600);
}
function getToken(){ try{ return localStorage.getItem(LS_TOKEN)||''; }catch(e){ return ''; } }

/* ============================================================
   本地持久化
   ============================================================ */
function saveLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify(state)); }catch(e){}
  try{ localStorage.setItem(LS_TYPES, JSON.stringify(state.types)); }catch(e){}
}
function loadLocal(){
  try{
    var s=JSON.parse(localStorage.getItem(LS_DATA));
    if(s && Array.isArray(s.notes)){ state=s; if(!state.nextNo) state.nextNo=state.notes.length+1; }
    else { state={notes:[],types:[],nextNo:1}; }
  }catch(e){ state={notes:[],types:[],nextNo:1}; }
  try{
    var t=localStorage.getItem(LS_TYPES);
    if(t){ var arr=JSON.parse(t); if(Array.isArray(arr)&&arr.length) state.types=arr; }
  }catch(e){}
  try{ var c=JSON.parse(localStorage.getItem(LS_COLLAPSE)); collapse=(c&&typeof c==='object')?c:{}; }catch(e){ collapse={}; }
}
function saveCollapse(){ try{ localStorage.setItem(LS_COLLAPSE, JSON.stringify(collapse)); }catch(e){} }

/* ============================================================
   类型
   ============================================================ */
function renderTypeSel(){
  var sel=document.getElementById('typeSel');
  sel.innerHTML='';
  state.types.forEach(function(t){
    var o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o);
  });
  if(state.types.length===0){
    var o=document.createElement('option'); o.value='其他'; o.textContent='其他'; sel.appendChild(o);
  }
}
function openTypeModal(){ renderTypeList(); document.getElementById('typeModal').classList.add('show'); }
function closeTypeModal(){ document.getElementById('typeModal').classList.remove('show'); }
function renderTypeList(){
  var box=document.getElementById('typeList'); box.innerHTML='';
  if(state.types.length===0){ box.innerHTML='<span style="color:var(--text2);font-size:13px">暂无类型，请在下方添加</span>'; return; }
  state.types.forEach(function(t){
    var chip=document.createElement('span'); chip.className='type-chip';
    chip.innerHTML=esc(t)+'<span class="del" title="删除类型">×</span>';
    chip.querySelector('.del').onclick=function(){ delType(t); };
    box.appendChild(chip);
  });
}
function addType(){
  var inp=document.getElementById('newTypeInput');
  var name=(inp.value||'').trim();
  if(!name){ toast('请输入类型名称','err'); return; }
  if(state.types.indexOf(name)>=0){ toast('该类型已存在','err'); return; }
  state.types.push(name); saveLocal(); renderTypeSel(); renderTypeList();
  inp.value=''; inp.focus(); toast('已添加类型：'+name,'ok');
}
function delType(t){
  state.types=state.types.filter(function(x){return x!==t;});
  saveLocal(); renderTypeSel(); renderTypeList(); toast('已删除类型：'+t,'ok');
}

/* ============================================================
   笔记：增删
   ============================================================ */
function saveNote(){
  var ta=document.getElementById('content');
  var content=(ta.value||'').trim();
  if(!content){ toast('请先写点内容','err'); return; }
  var type=document.getElementById('typeSel').value||'其他';
  if(state.types.indexOf(type)<0){ state.types.push(type); }
  var note={ id:state.nextNo++, time:nowStr(), content:content, type:type };
  state.notes.unshift(note);   // 新的在前
  saveLocal();
  ta.value='';
  render();
  toast('✅ 已保存（本地）','ok');
  // 尝试上传云端
  if(getToken()){ pushCloud(); }
}
function delNote(id){
  state.notes=state.notes.filter(function(n){return n.id!==id;});
  saveLocal(); render(); toast('已删除','ok');
  if(getToken()){ pushCloud(); }
}
document.getElementById('content').addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); saveNote(); }
});

/* ============================================================
   渲染分组
   ============================================================ */
function render(){
  renderTypeSel();
  var box=document.getElementById('groups');
  // 按类型分组
  var groups={}; var order=[];
  state.notes.forEach(function(n){
    if(!groups[n.type]){ groups[n.type]=[]; order.push(n.type); }
    groups[n.type].push(n);
  });
  var total=state.notes.length;
  document.getElementById('totalCnt').textContent=total?('· 共 '+total+' 条'):'';
  if(total===0){
    box.innerHTML='<div class="empty"><span class="e-emoji">🗒️</span>还没有记忆点，先在上方记录第一条吧～</div>';
    return;
  }
  var html='';
  order.forEach(function(type){
    var list=groups[type];
    var collapsed=collapse[type]; // true=收起
    html+='<div class="group'+(collapsed?' collapsed':'')+'" data-type="'+esc(type)+'">';
    html+='<div class="group-head" onclick="toggleGroup(\''+esc(type).replace(/'/g,"\\'")+'\')">';
    html+='<span class="gname">'+esc(type)+'</span>';
    html+='<span class="gcount">'+list.length+' 条</span>';
    html+='<span class="gtools" onclick="event.stopPropagation()">';
    html+='<button class="icon-btn" title="上移" onclick="moveGroup(\''+esc(type).replace(/'/g,"\\'")+'\',-1)">▲</button>';
    html+='<button class="icon-btn" title="下移" onclick="moveGroup(\''+esc(type).replace(/'/g,"\\'")+'\',1)">▼</button>';
    html+='</span>';
    html+='<span class="chev">▾</span>';
    html+='</div>';
    html+='<div class="group-body">';
    list.forEach(function(n){
      html+='<div class="note-item">';
      html+='<span class="note-no">'+n.id+'</span>';
      html+='<div class="note-main"><div class="note-content">'+esc(n.content)+'</div><div class="note-time">🕐 '+esc(n.time)+'</div></div>';
      html+='<button class="note-del" title="删除" onclick="delNote('+n.id+')">×</button>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  box.innerHTML=html;
}
function toggleGroup(type){
  collapse[type]=!collapse[type]; saveCollapse();
  var el=document.querySelector('.group[data-type="'+CSS.escape(type)+'"]');
  if(el) el.classList.toggle('collapsed');
}
function moveGroup(type,dir){
  var idx=state.types.indexOf(type);
  if(idx<0) return;
  var ni=idx+dir;
  if(ni<0||ni>=state.types.length){ toast('已在最'+(dir<0?'上':'下')+'','err'); return; }
  // 交换 types 顺序
  var tmp=state.types[idx]; state.types[idx]=state.types[ni]; state.types[ni]=tmp;
  saveLocal(); renderTypeSel(); render();
  if(getToken()){ pushCloud(); }
}

/* ============================================================
   GitHub 云同步
   ============================================================ */
function setSync(kind,text){
  var el=document.getElementById('syncStatus');
  el.className='sync-status'+(kind?(' '+kind):'');
  document.getElementById('syncText').textContent=text;
}

// 读取云端（多源兜底）
function pullCloud(cb){
  setSync('', getToken()?'同步中…':'读取中…');
  var tk=getToken(), ts='?t='+Date.now();
  function jget(url,opt){ return fetch(url,opt).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
  function apiSrc(){
    var h={'Accept':'application/vnd.github+json'}; if(tk) h['Authorization']='token '+tk;
    return jget('https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+DATA_FILE+ts,{headers:h,cache:'no-store'})
      .then(function(j){ return j&&j.content? JSON.parse(b64ToUtf8(j.content)): null; });
  }
  function rawSrc(){ return jget('https://raw.githubusercontent.com/'+GH_USER+'/'+GH_REPO+'/'+SYNC_BRANCH+'/'+DATA_FILE+'?x=1'+ts,{cache:'no-store'}); }
  var p = tk? apiSrc() : rawSrc();
  p.then(function(data){
    if(data && Array.isArray(data.notes)){
      // 合并：以 id 去重，云端 + 本机并集（本机新增的也保留）
      var map={};
      (data.notes||[]).forEach(function(n){ map[n.id]=n; });
      state.notes.forEach(function(n){ if(!map[n.id]) map[n.id]=n; });
      var merged=Object.keys(map).map(function(k){return map[k];});
      merged.sort(function(a,b){return b.id-a.id;});
      state.notes=merged;
      var maxId=0; state.notes.forEach(function(n){ if(n.id>maxId) maxId=n.id; });
      state.nextNo=maxId+1;
      if(Array.isArray(data.types)&&data.types.length) state.types=data.types;
      saveLocal(); render();
      setSync('ok','已同步 '+state.notes.length+' 条');
      if(cb) cb(true);
    } else {
      setSync('off','云端暂无数据');
      if(cb) cb(false);
    }
  }).catch(function(err){
    setSync('err','同步失败');
    if(cb) cb(false);
  });
}

// 写入云端（带 409 冲突重试）
function pushCloud(cb){
  var tk=getToken();
  if(!tk){ setSync('off','未设令牌'); if(cb) cb(false); return; }
  setSync('', '上传中…');
  var url='https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+DATA_FILE;
  var payloadData={ notes:state.notes, types:state.types, updatedAt:new Date().toISOString() };
  function encodeContent(o){ return utf8ToB64(o); }
  function putOnce(tryLeft){
    return fetch(url+'?ref='+SYNC_BRANCH+'&t='+Date.now(),{
        headers:{'Accept':'application/vnd.github+json','Authorization':'token '+tk}, cache:'no-store'
      })
      .then(function(r){ if(r.status===404) return {sha:null}; return r.json().then(function(j){return {sha:(j&&j.sha)||null};}); })
      .then(function(existing){
        var payload={ message:'sync: 更新记忆点数据 '+nowStr(), content:encodeContent(payloadData), branch:SYNC_BRANCH };
        if(existing.sha) payload.sha=existing.sha;
        return fetch(url,{ method:'PUT', headers:{'Accept':'application/vnd.github+json','Authorization':'token '+tk}, body:JSON.stringify(payload) })
          .then(function(rr){ return {ok:rr.ok, status:rr.status}; });
      })
      .then(function(res){
        if(!res.ok && res.status===409 && tryLeft>0){
          return new Promise(function(resolve){ setTimeout(function(){ resolve(putOnce(tryLeft-1)); },500); });
        }
        return res;
      });
  }
  putOnce(3).then(function(res){
    if(res.ok){ setSync('ok','已同步到 GitHub'); if(cb) cb(true); }
    else { setSync('err','上传失败('+res.status+')'); if(cb) cb(false); }
  }).catch(function(err){ setSync('err','上传失败'); if(cb) cb(false); });
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
  loadLocal();
  if(!state.types || state.types.length===0){
    state.types=['测试','高数','英语','操作系统','其他'];
    saveLocal();
  }
  render();
  if(getToken()){ pullCloud(); }
  else { setSync('off','未设令牌'); }
}
init();
</script>
